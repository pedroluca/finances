<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo-branca.png" />
    <!-- <link rel="icon" type="image/x-icon" href="/favicon.ico" /> -->
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Manifest PWA -->
    <link rel="manifest" href="/manifest.json?v=2" />
    
    <!-- Meta tags para mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finances" />
    
    <!-- Theme color (atualizada pelo ThemeProvider conforme o tema) -->
    <meta name="theme-color" content="#111827" />

    <!-- Aplica o tema ANTES do React montar para evitar flash branco -->
    <script>
      (function() {
        var dark = true;
        try {
          var saved = localStorage.getItem('theme');
          // Padrão: escuro. "system" segue o tema do aparelho.
          if (saved === 'light') dark = false;
          else if (saved === 'system') dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch(e) {}
        document.documentElement.classList.toggle('dark', dark);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#111827' : '#f5f6f8');
      })();
    </script>
    
    <!-- Descrição -->
    <meta name="description" content="Seu dashboard de controle de faturas" />
    
    <title>Finances | Gerenciador de faturas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
